<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hilaal Studios</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#overview">
      <img src="assets/logo-mark.png" alt="">
      <span class="brand-text">
        <span class="brand-name">HILAAL</span>
        <span class="brand-sub">STUDIOS</span>
      </span>
    </a>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button class="link-btn" id="exportBtn">Export backup</button>
      <label class="link-btn">Import backup<input type="file" id="importInput" accept="application/json" hidden></label>
    </div>
  </aside>

  <main id="main"></main>

  <dialog id="modal">
    <form id="modalForm" method="dialog">
      <h2 id="modalTitle"></h2>
      <div id="modalFields"></div>
      <div class="modal-actions">
        <button type="button" class="btn danger ghost" id="deleteBtn">Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
